name: Supermarket Offers Scraper

on:
  schedule:
    # Τρέχει καθημερινά στις 08:00 το πρωί (UTC)
    - cron: '0 8 * * *'
  workflow_dispatch: # Επιτρέπει και χειροκίνητη εκτέλεση από το GitHub

permissions:
  contents: write    # Απαραίτητο δικαίωμα για να κάνει commit & push στο repo

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Εργασία με το repository
        uses: actions/checkout@v4

      - name: Ρύθμιση Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Εγκατάσταση βιβλιοθηκών & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Εκτέλεση Scraper
        run: python scraper.py

      - name: Έλεγχος και αποθήκευση αλλαγών (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update supermarket offers [skip ci]" && git push)
