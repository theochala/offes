name: Supermarket Scraper & Auto-Upload

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 playwright
        playwright install --with-deps chromium

    - name: Run Scraper Script & Upload via FTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        python scraper.py

    - name: Commit and push clean_offers.json to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ -f clean_offers.json ]; then
          git add clean_offers.json
          git diff --staged --quiet || git commit -m "Auto-update clean_offers.json [skip ci]"
          git pull --rebase origin main || true
          git push
        else
          echo "Προειδοποίηση: Το clean_offers.json δεν βρέθηκε, παραλείπεται το push."
        fi
