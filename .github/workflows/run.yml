name: Supermarket Scraper & FTP

on:
  schedule:
    - cron: '0 */6 * * *' # Τρέχει κάθε 6 ώρες (ή όποτε θες)
  workflow_dispatch: # Επιτρέπει και χειροκίνητη εκτέλεση

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests
          
      - name: Install Playwright Browsers (ΥΠΟΧΡΕΩΤΙΚΟ ΓΙΑ ΝΑ ΜΗΝ ΚΟΛΛΑΕΙ)
        run: playwright install chromium

      - name: Run python scraper.py
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scraper.py
