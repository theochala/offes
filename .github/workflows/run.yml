name: Supermarket Scraper & Auto-Upload

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    
    # 1. Απαραίτητα δικαιώματα για να επιτρέπεται το Push
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Διατηρεί ολόκληρο το ιστορικό για αποφυγή exit code 128

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 playwright
        playwright install --with-deps chromium

    - name: Run Scraper Script
      continue-on-error: true
      run: |
        python supermarket_scraper.py

    - name: Commit and push clean_offers.json if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add clean_offers.json
        # Αποφυγή σφάλματος αν δεν υπάρχουν αλλαγές
        git diff --staged --quiet || git commit -m "Auto-update clean_offers.json [skip ci]"
        git push
