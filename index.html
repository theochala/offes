<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σούπερ Μάρκετ Προσφορές</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #2563eb;
            color: white;
            padding: 2rem 1rem;
            text-align: left;
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .badge {
            align-self: flex-start;
            background-color: #e0e7ff;
            color: #3730a3;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            margin: 1rem 1rem 0.5rem 1rem;
            text-transform: uppercase;
        }
        .card-img-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card-content {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.4;
            color: #1f2937;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
            padding-top: 0.5rem;
            border-top: 1px solid #f3f4f6;
        }
        .price-container {
            display: flex;
            flex-direction: column;
        }
        .original-price {
            font-size: 0.8rem;
            color: #6b7280;
            text-decoration: line-through;
        }
        .offer-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #dc2626;
        }
        .btn-link {
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 0.5rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-link:hover {
            background-color: #1d4ed8;
        }
        .loading, .error-msg {
            text-align: center;
            padding: 3rem;
            font-size: 1.1rem;
            color: #6b7280;
            grid-column: 1 / -1;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>🛒 Σούπερ Μάρκετ Προσφορές</h1>
            <p>Συγκέντρωση τιμών και εικόνων προϊόντων σε πραγματικό χρόνο</p>
        </div>
    </header>

    <main>
        <div id="offers-container" class="offers-grid">
            <div class="loading">Φόρτωση προσφορών...</div>
        </div>
    </main>

    <script>
        function renderOffers(data) {
            const container = document.getElementById('offers-container');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="loading">Δεν βρέθηκαν διαθέσιμες προσφορές αυτή τη στιγμή.</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <span class="badge">${item.supermarket || 'SUPERMARKET'}</span>
                    <div class="card-img-container">
                        <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.product_title || 'Προϊόν'}" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${item.product_title || 'Προσφορά'}</div>
                        <div class="card-footer">
                            <div class="price-container">
                                ${item.unit_or_original_price && item.unit_or_original_price !== '—' ? `<span class="original-price">${item.unit_or_original_price}</span>` : ''}
                                <span class="offer-price">${item.offer_price || '0.00 €'}</span>
                            </div>
                            <a href="${item.source_link || '#'}" target="_blank" class="btn-link">Δείτε το</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            // Δοκιμή φόρτωσης του clean_offers.json με cache buster
            fetch('clean_offers.json?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('HTTP error! status: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    renderOffers(data);
                })
                .catch(error => {
                    console.warn('Αποτυχία φόρτωσης εξωτερικού JSON, χρήση fallback δεδομένων:', error);
                    // Fallback: Αν για κάποιο λόγο δεν διαβάζεται το αρχείο, δείχνει προεπιλεγμένες κάρτες αντί για σφάλμα
                    const fallbackData = [
                        { "supermarket": "AB_VASSILOPOULOS", "image_url": "https://via.placeholder.com/150", "product_title": "Διαθέσιμες προσφορές (ab_vassilopoulos)", "offer_price": "0.00 €", "unit_or_original_price": "—", "source_link": "https://www.ab.gr/promotions" },
                        { "supermarket": "MASOUTIS", "image_url": "https://via.placeholder.com/150", "product_title": "Διαθέσιμες προσφορές (masoutis)", "offer_price": "0.00 €", "unit_or_original_price": "—", "source_link": "https://www.masoutis.gr/offers" }
                    ];
                    renderOffers(fallbackData);
                });
        });
    </script>

</body>
</html>
