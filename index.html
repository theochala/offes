<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperOffer Finder - Σύγκριση Προσφορών</title>
    <!-- Tailwind CSS για γρήγορο και όμορφο σχεδιασμό -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">🛒 SuperOffer Finder</h1>
            <p class="mt-2 text-blue-100">Σύγκριση προσφορών από όλα τα Σούπερ Μάρκετ</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        
        <!-- Φίλτρα Σούπερ Μάρκετ -->
        <div class="flex flex-wrap justify-center gap-2 mb-8" id="filter-buttons">
            <button onclick="filterOffers('all')" class="filter-btn px-4 py-2 bg-blue-600 text-white rounded-full font-semibold shadow transition hover:bg-blue-700">Όλα τα Σούπερ Μάρκετ</button>
            <button onclick="filterOffers('Σκλαβενίτης')" class="filter-btn px-4 py-2 bg-white text-gray-700 rounded-full font-semibold shadow transition hover:bg-gray-200">Σκλαβενίτης</button>
            <button onclick="filterOffers('ΑΒ Βασιλόπουλος')" class="filter-btn px-4 py-2 bg-white text-gray-700 rounded-full font-semibold shadow transition hover:bg-gray-200">ΑΒ Βασιλόπουλος</button>
            <button onclick="filterOffers('Μασούτης')" class="filter-btn px-4 py-2 bg-white text-gray-700 rounded-full font-semibold shadow transition hover:bg-gray-200">Μασούτης</button>
            <button onclick="filterOffers('MyMarket')" class="filter-btn px-4 py-2 bg-white text-gray-700 rounded-full font-semibold shadow transition hover:bg-gray-200">MyMarket</button>
            <button onclick="filterOffers('Lidl')" class="filter-btn px-4 py-2 bg-white text-gray-700 rounded-full font-semibold shadow transition hover:bg-gray-200">Lidl</button>
        </div>

        <!-- Λίστα Προσφορών -->
        <div id="offers-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Εδώ θα φορτωθούν δυναμικά οι προσφορές -->
            <p class="text-center col-span-full text-gray-500">Φόρτωση προσφορών...</p>
        </div>
    </main>

    <!-- JavaScript για ανάγνωση του JSON -->
    <script>
        let allOffersData = [];

        async function loadOffers() {
            try {
                // Διαβάζει το αρχείο clean_offers.json από τον server σου
                const response = await fetch('clean_offers.json?' + new Date().getTime());
                if (!response.ok) throw new Error('Αποτυχία φόρτωσης αρχείου');
                
                const data = await response.json();
                allOffersData = data.offers || [];
                
                displayOffers(allOffersData);
            } catch (error) {
                console.error(error);
                document.getElementById('offers-container').innerHTML = `
                    <p class="text-center col-span-full text-red-500 font-semibold">Δεν βρέθηκαν προσφορές ή απέτυχε η σύνδεση με το αρχείο.</p>
                `;
            }
        }

        function displayOffers(offers) {
            const container = document.getElementById('offers-container');
            container.innerHTML = '';

            if (offers.length === 0) {
                container.innerHTML = `<p class="text-center col-span-full text-gray-500">Δεν βρέθηκαν προσφορές.</p>`;
                return;
            }

            offers.forEach(offer => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-md p-5 flex flex-col justify-between border border-gray-200 hover:shadow-lg transition';
                
                card.innerHTML = `
                    <div>
                        <span class="text-xs font-bold uppercase px-2 py-1 bg-blue-100 text-blue-800 rounded-full">${offer.supermarket}</span>
                        <h3 class="text-lg font-semibold text-gray-800 mt-3">${offer.title}</h3>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="text-xl font-bold text-green-600">${offer.price}</span>
                        <span class="text-xs text-gray-400">${offer.date || ''}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterOffers(supermarketName) {
            // Αλλαγή στυλ κουμπιών
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });
            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-blue-600', 'text-white');

            // Φιλτράρισμα δεδομένων
            if (supermarketName === 'all') {
                displayOffers(allOffersData);
            } else {
                const filtered = allOffersData.filter(item => item.supermarket === supermarketName);
                displayOffers(filtered);
            }
        }

        // Φόρτωση των προσφορών όταν ανοίξει η σελίδα
        window.onload = loadOffers;
    </script>
</body>
</html>
