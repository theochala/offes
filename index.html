<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperOffer Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-blue-600 text-white py-6 shadow-md text-center">
        <h1 class="text-3xl font-bold flex items-center justify-center gap-2">
            🛒 SuperOffer Finder
        </h1>
        <p class="text-blue-100 text-sm mt-1">Σύγκριση προσφορών από όλα τα Σούπερ Μάρκετ</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <div class="bg-white p-4 rounded-lg shadow-sm flex flex-col md:flex-row gap-4 mb-6">
            <div class="flex-1">
                <input 
                    type="text" 
                    id="search-input" 
                    oninput="filterOffers()"
                    placeholder="Αναζήτηση προϊόντος (π.χ. Γάλα, Καφές)..." 
                    class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>
            <div>
                <select 
                    id="supermarket-select" 
                    onchange="filterOffers()"
                    class="w-full md:w-64 border border-blue-500 text-gray-700 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                >
                    <option value="all">Όλα τα Σούπερ Μάρκετ</option>
                    <option value="Σκλαβενίτης">Σκλαβενίτης</option>
                    <option value="ΑΒ Βασιλόπουλος">ΑΒ Βασιλόπουλος</option>
                    <option value="Μασούτης">Μασούτης</option>
                    <option value="MyMarket">MyMarket</option>
                    <option value="Lidl">Lidl</option>
                </select>
            </div>
        </div>

        <div id="offers-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <p class="text-center col-span-full text-gray-500 py-8">Φόρτωση προσφορών...</p>
        </div>
    </main>

    <script>
        let rawOffersData = [];

        // Εφεδρικά δεδομένα (αν δεν βρεθεί το αρχείο JSON)
        const fallbackOffers = [
            { supermarket: "Σκλαβενίτης", title: "Ελληνικό Φρέσκο Γάλα 1L", price: "1.25€", date: "2026-06-06" },
            { supermarket: "ΑΒ Βασιλόπουλος", title: "Ηλιέλαιο 5L", price: "7.80€", date: "2026-06-06" },
            { supermarket: "Μασούτης", title: "Αλεύρι για όλες τις χρήσεις 1kg", price: "0.85€", date: "2026-06-06" },
            { supermarket: "MyMarket", title: "Μακαρόνια No. 6 500g", price: "0.68€", date: "2026-06-06" },
            { supermarket: "Lidl", title: "Φέτα ΠΟΠ 400g", price: "3.49€", date: "2026-06-06" }
        ];

        async function fetchOffers() {
            try {
                const res = await fetch('clean_offers.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error('Δεν βρέθηκε το αρχείο');
                
                const json = await res.json();
                
                if (Array.isArray(json)) {
                    rawOffersData = json;
                } else if (json.offers && Array.isArray(json.offers)) {
                    rawOffersData = json.offers;
                } else {
                    rawOffersData = fallbackOffers;
                }
            } catch (err) {
                console.warn('Χρήση εφεδρικών δεδομένων (Fallback):', err);
                rawOffersData = fallbackOffers; // Αν αποτύχει, δείχνει τα δοκιμαστικά για να μην μένει κενό
            }
            filterOffers();
        }

        function filterOffers() {
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const marketVal = document.getElementById('supermarket-select').value;

            const filtered = rawOffersData.filter(item => {
                const matchesMarket = (marketVal === 'all') || (item.supermarket === marketVal);
                const matchesSearch = !searchVal || (item.title && item.title.toLowerCase().includes(searchVal));
                return matchesMarket && matchesSearch;
            });

            renderOffers(filtered);
        }

        function renderOffers(offers) {
            const container = document.getElementById('offers-container');
            container.innerHTML = '';

            if (offers.length === 0) {
                container.innerHTML = `<p class="text-center col-span-full text-gray-500 py-8">Δεν βρέθηκαν προσφορές.</p>`;
                return;
            }

            offers.forEach(offer => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg border border-gray-200 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between';
                
                card.innerHTML = `
                    <div>
                        <span class="inline-block text-xs font-semibold px-2 py-1 bg-blue-50 text-blue-600 rounded mb-2">
                            ${offer.supermarket || 'Σούπερ Μάρκετ'}
                        </span>
                        <h3 class="text-sm font-medium text-gray-800 line-clamp-2 mb-2">
                            ${offer.title}
                        </h3>
                    </div>
                    <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-100">
                        <span class="text-lg font-bold text-green-600">${offer.price}</span>
                        ${offer.date ? `<span class="text-xs text-gray-400">${offer.date}</span>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', fetchOffers);
    </script>
</body>
</html>
