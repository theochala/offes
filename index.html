<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMarket Offers Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">🛒 SuperOffer Finder</h1>
            <p class="text-blue-100 text-sm mt-1">Σύγκριση προσφορών από όλα τα Σούπερ Μάρκετ</p>
        </div>
    </header>

    <!-- Filters & Search -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white p-4 rounded-xl shadow mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- Search Bar -->
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Αναζήτηση προϊόντος (π.χ. Γάλα, Καφές)..." 
                class="w-full md:w-1/2 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                oninput="filterProducts()"
            >
            
            <!-- Supermarket Filter -->
            <select id="marketFilter" onchange="filterProducts()" class="w-full md:w-1/3 p-3 border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="ALL">Όλα τα Σούπερ Μάρκετ</option>
                <option value="Σκλαβενίτης">Σκλαβενίτης</option>
                <option value="ΑΒ Βασιλόπουλος">ΑΒ Βασιλόπουλος</option>
                <option value="Μασούτης">Μασούτης</option>
                <option value="MyMarket">MyMarket</option>
            </select>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Τα προϊόντα φορτώνονται δυναμικά από την JS -->
        </div>
    </main>

    <script>
        let allProducts = [];

        // Φόρτωση δεδομένων από το JSON
        async function loadProducts() {
            try {
                const response = await fetch('offers.json');
                allProducts = await response.json();
                renderProducts(allProducts);
            } catch (error) {
                console.error("Σφάλμα φόρτωσης δεδομένων:", error);
            }
        }

        // Εμφάνιση προϊόντων
        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">Δεν βρέθηκαν προσφορές.</p>`;
                return;
            }

            products.forEach(p => {
                const card = `
                    <div class="bg-white rounded-xl shadow hover:shadow-lg transition p-5 flex flex-col justify-between relative border">
                        <span class="absolute top-3 right-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">
                            -${p.discount_percent}%
                        </span>
                        <div>
                            <img src="${p.image}" alt="${p.name}" class="w-full h-40 object-cover rounded-md mb-4">
                            <span class="text-xs text-gray-400 font-semibold uppercase">${p.category}</span>
                            <h2 class="font-bold text-lg text-gray-800 leading-snug">${p.name}</h2>
                            <p class="text-sm text-gray-500 mb-3">${p.brand}</p>
                        </div>
                        
                        <div class="border-t pt-3 flex justify-between items-end">
                            <div>
                                <span class="text-xs text-gray-500 block">${p.supermarket}</span>
                                <span class="text-gray-400 line-through text-sm">€${p.original_price.toFixed(2)}</span>
                                <span class="text-2xl font-black text-green-600 block">€${p.offer_price.toFixed(2)}</span>
                            </div>
                            <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
                                Σύγκριση
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Φιλτράρισμα
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedMarket = document.getElementById('marketFilter').value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(query) || p.brand.toLowerCase().includes(query);
                const matchesMarket = selectedMarket === "ALL" || p.supermarket === selectedMarket;
                return matchesSearch && matchesMarket;
            });

            renderProducts(filtered);
        }

        // Εκκίνηση
        loadProducts();
    </script>
</body>
</html>
