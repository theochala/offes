<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σούπερ Μάρκετ - Προσφορές</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-blue-600 text-white shadow-md py-6 mb-8">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold">🛒 Σούπερ Μάρκετ Προσφορές</h1>
            <p class="text-blue-100 mt-1">Συγκέντρωση τιμών και εικόνων προϊόντων σε πραγματικό χρόνο</p>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
        <div id="loading" class="text-center py-10 text-gray-600 text-lg">Φόρτωση προσφορών...</div>
        
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Εδώ φορτώνονται οι κάρτες -->
        </div>
    </main>

    <script>
        async function loadOffers() {
            try {
                const response = await fetch('clean_offers.json');
                const products = await response.json();
                
                const grid = document.getElementById('products-grid');
                const loading = document.getElementById('loading');
                
                loading.style.display = 'none';
                grid.innerHTML = '';

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-lg shadow-md p-4 flex flex-col justify-between hover:shadow-lg transition-shadow border border-gray-200';
                    
                    const imgSrc = product.image && product.image.startsWith('http') 
                        ? product.image 
                        : 'https://via.placeholder.com/150?text=No+Image';

                    card.innerHTML = `
                        <div>
                            <div class="relative h-48 mb-3 overflow-hidden rounded bg-gray-50 flex items-center justify-center">
                                <img src="${imgSrc}" alt="${product.title}" class="object-contain h-full w-full p-2">
                                <span class="absolute top-2 left-2 text-xs font-semibold bg-red-100 text-red-600 px-2 py-1 rounded-full uppercase shadow">${product.supermarket}</span>
                            </div>
                            <h2 class="text-gray-800 font-medium text-sm mb-3 line-clamp-2">${product.title}</h2>
                        </div>
                        <div class="flex items-center justify-between mt-auto pt-3 border-t border-gray-100">
                            <span class="text-xl font-bold text-green-600">${product.price}</span>
                            <span class="text-xs text-gray-500 bg-gray-50 px-2 py-1 rounded border">${product.all_prices[0] || ''}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Σφάλμα φόρτωσης:', error);
                document.getElementById('loading').innerHTML = 'Σφάλμα κατά τη φόρτωση των δεδομένων.';
            }
        }

        loadOffers();
    </script>
</body>
</html>
