<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>SuperOffer Finder</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        .filters { text-align: center; margin-bottom: 20px; }
        select { padding: 8px; font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { max-width: 100%; height: 140px; object-fit: contain; margin-bottom: 10px; }
        .card h3 { font-size: 14px; margin: 0 0 10px 0; color: #333; }
        .card .price { font-size: 18px; font-weight: bold; color: #27ae60; }
        .card .store { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>🛒 SuperOffer Finder</h1>
        <p>Σύγκριση προσφορών από όλα τα Σούπερ Μάρκετ</p>
    </header>

    <div class="filters">
        <select id="storeFilter" onchange="filterOffers()">
            <option value="all">Όλα τα Σούπερ Μάρκετ</option>
        </select>
    </div>

    <main id="offersContainer" style="text-align: center;">
        <p>Φόρτωση προσφορών...</p>
    </main>

    <script>
        let allOffers = [];

        async function loadOffers() {
            try {
                // Ζητάει το αρχείο από τον ίδιο φάκελο
                const response = await fetch('clean_offers.json');
                if (!response.ok) throw new Error('Αποτυχία φόρτωσης JSON');
                
                const data = await response.json();
                allOffers = data.offers;
                
                setupFilters(allOffers);
                displayOffers(allOffers);
            } catch (error) {
                document.getElementById('offersContainer').innerHTML = '<p style="color: red;">Σφάλμα κατά τη φόρτωση των προσφορών. Βεβαιωθείτε ότι ανέβηκε το clean_offers.json.</p>';
                console.error(error);
            }
        }

        function setupFilters(offers) {
            const stores = [...new Set(offers.map(o => o.supermarket))];
            const select = document.getElementById('storeFilter');
            stores.forEach(store => {
                const opt = document.createElement('option');
                opt.value = store;
                opt.textContent = store;
                select.appendChild(opt);
            });
        }

        function filterOffers() {
            const selectedStore = document.getElementById('storeFilter').value;
            if (selectedStore === 'all') {
                displayOffers(allOffers);
            } else {
                const filtered = allOffers.filter(o => o.supermarket === selectedStore);
                displayOffers(filtered);
            }
        }

        function displayOffers(offers) {
            const container = document.getElementById('offersContainer');
            if (offers.length === 0) {
                container.innerHTML = '<p>Δεν βρέθηκαν προσφορές.</p>';
                return;
            }

            let html = '<div class="grid">';
            offers.forEach(o => {
                html += `
                    <div class="card">
                        <div>
                            <img src="${o.image}" alt="${o.title}" loading="lazy">
                            <h3>${o.title}</h3>
                        </div>
                        <div>
                            <div class="price">${o.price}</div>
                            <div class="store">${o.supermarket}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        loadOffers();
    </script>
</body>
</html>
